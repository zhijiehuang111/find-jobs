name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Python 版本照 .python-version，套件版本照 uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # 只是檢查 tsc 和 vite 打包能過，產物跟著臨時機器一起丟掉
      - run: npm run build

  deploy:
    # 兩個檢查都綠燈、而且是 push 到 main 才部署
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 連續 push 時排隊，不會兩次部署同時跑
    concurrency: deploy
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # ssh 進 VPS，把 EOF 之間的腳本交給 VPS 上的 bash 執行
      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh zhijie@"$SSH_HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          # 非互動式 ssh 不會載入 .bashrc，node（fnm）和 uv 要自己加進 PATH
          export PATH="$HOME/.local/share/fnm/aliases/default/bin:$HOME/.local/bin:$PATH"

          cd ~/find-jobs
          git pull --ff-only
          git -C private pull --ff-only
          uv sync --locked
          (cd frontend && npm ci && npm run build)
          sudo -n systemctl restart find-jobs-api

          # health check：API 啟動要幾秒，輪詢最多 30 秒
          for _ in $(seq 1 15); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/api/stats; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not come up in 30s" >&2
          journalctl -u find-jobs-api -n 30 --no-pager || true
          exit 1
          EOF
