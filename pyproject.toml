[project]
name = "find-jobs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.3.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.isort]
# private/ 是另一個 repo，CI 上不存在；不寫的話 ruff 在 CI 會把它當第三方套件，import 排序結果跟本機不同
known-first-party = ["private"]
